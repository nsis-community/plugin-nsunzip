name: Build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  plugin:
    name: nsUnzip / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolchain: msvc, os: windows-latest, release: true }
          - { toolchain: mingw, os: ubuntu-latest, release: false }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: nsis-dev/build-plugin@main
        with:
          name: nsUnzip
          toolchain: ${{ matrix.toolchain }}
          release: ${{ matrix.release }}
          sources: |
            Contrib/nsUnzip/*.c
            Contrib/nsUnzip/win32/*.c
            Contrib/nsUnzip/windll/*.c
            Contrib/nsUnzip/nsUnzip/*.c
            Contrib/nsUnzip/nsUnzip/Resources/*.rc
